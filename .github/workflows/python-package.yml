# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 and 3.10 are end-of-life. Django 6 (installed from
        # django>=5.0) requires Python >= 3.12.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # mysqlclient is built from source and needs the MySQL client headers.
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-django
        python -m pip install -r backend/requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      working-directory: backend
      env:
        DB_ENGINE: sqlite
        DJANGO_DEBUG: "false"
        # The test client speaks HTTP. Production still redirects unless this is set.
        DJANGO_SECURE_SSL_REDIRECT: "false"
      run: |
        # Per-job throwaway key so the workflow file contains no secret.
        export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
        pytest
